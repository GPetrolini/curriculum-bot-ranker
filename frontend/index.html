<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Candidatos — recruta.ai</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-dot"></div>
        recruta.ai
      </div>
      <nav class="nav">
        <div class="nav-item active"><i class="ti ti-users"></i> Candidatos</div>
        <div class="nav-item"><i class="ti ti-chart-bar"></i> Relatórios</div>
        <div class="nav-item"><i class="ti ti-bell"></i> Notificações</div>
        <div class="nav-item"><i class="ti ti-settings"></i> Config.</div>
      </nav>
      <div class="sidebar-footer">v1.0.0</div>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="page-header">
        <h1 class="page-title">Painel de candidatos</h1>
        <p class="page-sub">Todos os currículos enviados para o bot.</p>
      </div>

      <!-- Stat card -->
      <div class="stat-card">
        <div class="stat-icon"><i class="ti ti-users"></i></div>
        <div>
          <div class="stat-label">Total de candidatos</div>
          <div class="stat-value" id="totalCount">—</div>
        </div>
        <div class="stat-sep"></div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <div class="search-wrap">
          <i class="ti ti-search search-icon"></i>
          <input type="text" id="searchInput" placeholder="Buscar por nome, e-mail ou skill..." oninput="go()" />
        </div>
        <div class="filter-wrap">
          <select id="sortSelect" onchange="go()">
            <option value="desc">Score: menor → maior</option>
            <option value="asc">Score: maior → menor</option>
            <option value="name">Ordenar por nome</option>
          </select>
          <i class="ti ti-chevron-down chevron-icon"></i>
        </div>
      </div>

      <!-- List header -->
      <div class="list-header">
        <span class="lh-name">Candidato</span>
        <span class="lh-right">Ranking · Score</span>
      </div>

      <!-- Candidate list -->
      <div id="list"></div>
    </main>

  </div>

  <!-- Modal -->
  <div id="modal-overlay">
    <div class="modal">

      <div class="modal-header">
        <div>
          <div class="modal-name" id="modal-name"></div>
          <div class="modal-id" id="modal-id"></div>
        </div>
        <button class="modal-close" onclick="closeModal()">
          <i class="ti ti-x"></i>
        </button>
      </div>

      <div class="modal-body">

        <div class="modal-row">
          <div class="modal-field">
            <div class="mf-label"><i class="ti ti-mail"></i> E-mail</div>
            <div class="mf-value" id="modal-email"></div>
          </div>
          <div class="modal-field">
            <div class="mf-label"><i class="ti ti-phone"></i> Telefone</div>
            <div class="mf-value" id="modal-phone"></div>
          </div>
        </div>

        <div class="modal-row">
          <div class="modal-field">
            <div class="mf-label"><i class="ti ti-briefcase"></i> Experiência</div>
            <div class="mf-value" id="modal-exp"></div>
          </div>
          <div class="modal-field">
            <div class="mf-label"><i class="ti ti-chart-bar"></i> Score final</div>
            <div class="mf-value" id="modal-score"></div>
          </div>
        </div>

        <div class="modal-field full">
          <div class="mf-label"><i class="ti ti-medal"></i> Ranking</div>
          <div><span class="modal-badge" id="modal-ranking"></span></div>
        </div>

        <div class="modal-field full">
          <div class="mf-label"><i class="ti ti-file-text"></i> Resumo</div>
          <div class="mf-value" id="modal-summary"></div>
        </div>

        <div class="modal-field full">
          <div class="mf-label"><i class="ti ti-tags"></i> Skills</div>
          <div class="skills-wrap" id="modal-skills"></div>
        </div>

      </div>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
