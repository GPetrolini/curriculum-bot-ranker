site_name: Curriculum Bot Ranker
site_description: Documentação técnica gerada a partir do código-fonte
docs_dir: docs
nav:
  - Home: index.md
  - Backend:
      - Overview: backend/index.md
      - API: backend/api.md
      - Serviços: backend/services.md
      - Integrações: backend/integrations.md
  - Frontend:
      - Overview: frontend/index.md
  - Banco de Dados:
      - Overview: database/index.md
  - Pipeline:
      - Overview: pipeline/index.md
theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
plugins:
  - search
