services:
  - type: web
    name: curriculum-bot-ranker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GCP_PROJECT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: VACANCY_TITLE
        sync: false
      - key: VACANCY_DESCRIPTION
        sync: false
      - key: VACANCY_SENIORITY
        sync: false
      - key: VACANCY_DEPARTMENT
        sync: false
      - key: VACANCY_STATUS
        sync: false

  - type: worker
    name: background-worker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python background_worker.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BACKGROUND_WORKER_INTERVAL
        value: "30"
